<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>haukethimm.com</title>

    <!-- Font: Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cream: #fdf7f2;
        --blue: #003153;

        --top-offset: 30px;
        --banner-h: 110px;

        --logo-h: 175px;
        --side-pad: 175px;

        --footer-h: 140px;

        --max-width: 1400px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--cream);
        color: var(--blue);
        font-family: "Cormorant Garamond", serif;
        font-optical-sizing: auto;
        font-weight: 500;
      }

      /* ===== FIXED NAV (Banner + Logo, no text) ===== */
      .nav-shell {
        position: fixed;
        top: var(--top-offset);
        left: 0;
        width: 100%;
        z-index: 9999;
        pointer-events: none;
      }

      .main-nav {
        position: relative;
        height: var(--banner-h);
        background-color: var(--blue);
        pointer-events: auto;
      }

      .nav-inner {
        height: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 var(--side-pad);
      }

      .nav-logo {
        position: absolute;
        left: var(--side-pad);
        top: calc(var(--banner-h) - (var(--logo-h) / 2));
      }

      .nav-logo img {
        height: var(--logo-h);
        width: auto;
        display: block;
      }

      /* ===== HEADER IMAGE (FULL WIDTH, NO CROPPING) ===== */
      .header-image {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .header-image img {
        width: 100%;   /* full width */
        height: auto;  /* no cropping, keeps full image */
        display: block;
      }

      /* ===== CONTENT (text + footer) ===== */
      .page-shell {
        min-height: calc(100vh - var(--footer-h));
        display: flex;
        flex-direction: column;

        /* space so content begins below fixed nav + logo overlap */
        padding-top: calc(
          var(--top-offset) + var(--banner-h) + (var(--logo-h) / 2)
        );
      }

      /* ===== MAINTENANCE TEXT ===== */
      .maintenance {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 var(--side-pad);
      }

      .maintenance p {
        margin: 0;
        font-size: 20px;
        font-weight: 300;
        line-height: 1.7;
      }

      .maintenance strong {
        font-weight: 500;
      }

      /* ===== FOOTER ===== */
      .footer {
        height: var(--footer-h);
        background-color: var(--blue);
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 1200px) {
        :root {
          --side-pad: 32px;
        }
        .nav-logo {
          left: var(--side-pad);
        }
      }

      @media (max-width: 768px) {
        :root {
          --top-offset: 16px;
          --banner-h: 86px;
          --logo-h: 120px;
          --side-pad: 18px;
        }

        .maintenance p {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Fixed Nav -->
    <div class="nav-shell">
      <nav class="main-nav" aria-label="Primary">
        <a class="nav-logo" href="#">
          <img src="img/logo.png" alt="Hauke Thimm" />
        </a>
        <div class="nav-inner"></div>
      </nav>
    </div>

    <!-- Header image (full width, no crop) -->
    <section class="header-image" aria-label="Header image">
      <img src="img/header.jpg" alt="" />
    </section>

    <!-- Content (text + footer) -->
    <main class="page-shell">
      <section class="maintenance" aria-label="Under construction message">
        <p>
          <strong>Welcome.</strong><br />
          This website ist currently under construction.<br /><br />
          Kind regards,<br />
          Hauke Thimm
        </p>
      </section>

      <footer class="footer" aria-label="Footer"></footer>
    </main>
  </body>
</html>
