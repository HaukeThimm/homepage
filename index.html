<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Bootstrap -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Schriftart Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        color: #003153;
        background-color: #fdf7f2;
        font-family: "Cormorant Garamond", serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 36px;
      }

      /* Full-width nav banner */
      .main-nav {
        width: 100%;
        height: 100px;
        background-color: #003153;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-nav a {
        color: #fdf7f2;
        text-decoration: none;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .main-nav a:hover {
        text-decoration: underline;
      }

      /* Content spacing below the banner */
      .container-xl {
        padding-top: 30px;
        text-align: center;
      }

      /* Mobile: stack nav items vertically */
      @media (max-width: 768px) {
        .main-nav {
          height: auto;
          padding: 24px 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAV BANNER (full width, no indentation) -->
    <nav class="main-nav">
      <div class="d-flex flex-column flex-md-row gap-3 gap-md-5">
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">References</a>
        <a href="#">Contact</a>
        <a href="#">Imprint</a>
      </div>
    </nav>

    <!-- Existing content -->
    <div class="container-xl">
      <div class="d-flex justify-content-center">
        <div><img src="img/logo.png" class="img-fluid" width="200" alt="Logo" /></div>
      </div>

      <div class="d-flex justify-content-center">
        <div>
          Welcome.<br/>
          Unfortunately this website is currently under construction.<br/>
          I look forward to welcoming you here soon.<br/><br/>
          Kind regards,<br/>
          Hauke Thimm
        </div>
      </div>
    </div>

    <!-- Optional: only needed if you use Bootstrap JS components -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
