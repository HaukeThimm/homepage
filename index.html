<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>haukethimm.com</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cream: #fdf7f2;
      --blue: #003153;

      --top-offset: 30px;
      --banner-h: 110px;
      --logo-h: 175px;
      --side-pad: 175px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--blue);
      font-family: "Cormorant Garamond", serif;
      overflow: hidden; /* kein Scrollen */
    }

    /* ===== HEADER IMAGE ===== */
    .header-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-image img {
      width: 100%;      /* volle Breite */
      height: auto;     /* kein Cropping */
      display: block;
    }

    /* ===== FIXED NAV (DESKTOP) ===== */
    .nav-shell {
      position: fixed;
      top: var(--top-offset);
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .main-nav {
      height: var(--banner-h);
      background: var(--blue);
      position: relative;
      pointer-events: auto;
    }

    .nav-logo {
      position: absolute;
      left: var(--side-pad);
      top: calc(var(--banner-h) - (var(--logo-h) / 2));
    }

    .nav-logo img {
      height: var(--logo-h);
      width: auto;
      display: block;
    }

    /* ===== CONTENT BELOW HEADER ===== */
    .content {
      position: relative;
      z-index: 5;
      margin-top: calc(
        (100vw * 430 / 3000)
      ); 
      /* Verhältnis: Headerhöhe = Bildhöhe/Bildbreite * Viewportbreite
         → Passe 430/3000 an die echte Höhe/Breite deines header.jpg an */
      text-align: center;
      padding: 40px var(--side-pad) 0;
    }

    .content p {
      margin: 0;
      font-size: 20px;
      font-weight: 300;
      line-height: 1.7;
    }

    .content strong {
      font-weight: 500;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      :root {
        --top-offset: 16px;
        --banner-h: auto;
        --side-pad: 18px;
      }

      .main-nav {
        background: transparent;
        height: auto;
      }

      .nav-logo {
        position: static;
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }

      .nav-logo img {
        width: 40vw; /* 40% Displaybreite */
        height: auto;
      }

      .content {
        padding: 24px 18px 0;
        margin-top: auto; /* mobil: natürlich unter Bild */
      }

      .content p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- Header image -->
  <section class="header-image">
    <img src="img/header.jpg" alt="" />
  </section>

  <!-- Fixed Nav -->
  <div class="nav-shell">
    <nav class="main-nav">
      <a class="nav-logo" href="#">
        <img src="img/logo.png" alt="Hauke Thimm" />
      </a>
    </nav>
  </div>

  <!-- Text BELOW header image -->
  <main class="content">
    <p>
      <strong>Welcome.</strong><br />
      This website is currently under construction.<br /><br />
      Kind regards,<br />
      Hauke Thimm
    </p>
  </main>

</body>
</html>
