<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>haukethimm.com</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cream: #fdf7f2;
        --blue: #003153;

        --top-offset: 30px;
        --banner-h: 110px;
        --logo-h: 175px;
        --side-pad: 175px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden; /* ⬅️ KEIN SCROLL */
        background-color: var(--cream);
        color: var(--blue);
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
      }

      /* ===== FIXED NAV ===== */
      .nav-shell {
        position: fixed;
        top: var(--top-offset);
        left: 0;
        width: 100%;
        z-index: 1000;
        pointer-events: none;
      }

      .main-nav {
        height: var(--banner-h);
        background-color: var(--blue);
        position: relative;
        pointer-events: auto;
      }

      .nav-logo {
        position: absolute;
        left: var(--side-pad);
        top: calc(var(--banner-h) - (var(--logo-h) / 2));
      }

      .nav-logo img {
        height: var(--logo-h);
        width: auto;
        display: block;
      }

      /* ===== PAGE LAYOUT (ONE SCREEN) ===== */
      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER IMAGE ===== */
      .header-image {
        width: 100%;
        max-height: 42vh; /* ⬅️ entscheidend: verhindert Scroll */
        overflow: hidden;
      }

      .header-image img {
        width: 100%;
        height: auto;
        display: block; /* kein Cropping */
      }

      /* ===== CENTERED TEXT ===== */
      .maintenance {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 var(--side-pad);
      }

      .maintenance p {
        margin: 0;
        font-size: 22px;
        font-weight: 300;
        line-height: 1.7;
      }

      .maintenance strong {
        font-weight: 500;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 768px) {
        :root {
          --top-offset: 16px;
          --banner-h: 86px;
          --logo-h: 120px;
          --side-pad: 18px;
        }

        body {
          overflow: auto; /* Scroll auf Mobile erlaubt */
        }

        .header-image {
          max-height: none;
        }

        .maintenance p {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Fixed Nav -->
    <div class="nav-shell">
      <nav class="main-nav">
        <a class="nav-logo" href="#">
          <img src="img/logo.png" alt="Hauke Thimm" />
        </a>
      </nav>
    </div>

    <!-- ONE SCREEN CONTENT -->
    <div class="page">
      <!-- Header -->
      <section class="header-image">
        <img src="img/header.jpg" alt="" />
      </section>

      <!-- Centered Text -->
      <section class="maintenance">
        <p>
          <strong>Welcome.</strong><br />
          This website is currently under construction.<br /><br />
          Kind regards,<br />
          Hauke Thimm
        </p>
      </section>
    </div>
  </body>
</html>
