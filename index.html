<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>haukethimm.com</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cream: #fdf7f2;
      --blue: #003153;

      --top-offset: 30px;
      --banner-h: 110px;
      --logo-h: 175px;
      --side-pad: 175px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--blue);
      font-family: "Cormorant Garamond", serif;
      overflow: hidden;
    }

    /* ===== HEADER IMAGE ===== */
    .header-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-image img {
      width: 100%;
      height: auto; /* no cropping */
      display: block;
    }

    /* ===== FIXED NAV (DESKTOP) ===== */
    .nav-shell {
      position: fixed;
      top: var(--top-offset);
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .main-nav {
      height: var(--banner-h);
      background: var(--blue);
      position: relative;
      pointer-events: auto;
    }

    .nav-logo {
      position: absolute;
      left: var(--side-pad);
      top: calc(var(--banner-h) - (var(--logo-h) / 2));
    }

    .nav-logo img {
      height: var(--logo-h);
      width: auto;
      display: block;
    }

    /* ===== CENTERED TEXT (DESKTOP) ===== */
    .maintenance {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 var(--side-pad);
      pointer-events: none;
    }

    .maintenance p {
      margin: 0;
      font-size: 20px;
      font-weight: 300;
      line-height: 1.7;
      background: rgba(253,247,242,0.85);
      padding: 18px 24px;
      border-radius: 6px;
    }

    .maintenance strong {
      font-weight: 500;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      :root {
        --top-offset: 0;
        --banner-h: auto;
        --side-pad: 18px;
      }

      /* Remove banner look on mobile */
      .main-nav {
        background: transparent;
        height: auto;
      }

      .nav-logo {
        position: static;
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }

      .nav-logo img {
        width: 40vw;   /* 40% of viewport width */
        height: auto;
      }

      /* Stack logo + text */
      .maintenance {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 18px;
        text-align: center;
      }

      .maintenance p {
        margin-top: 24px;
        font-size: 18px;
        padding: 16px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Header image -->
  <section class="header-image">
    <img src="img/header.jpg" alt="" />
  </section>

  <!-- Nav / Logo -->
  <div class="nav-shell">
    <nav class="main-nav">
      <a class="nav-logo" href="#">
        <img src="img/logo.png" alt="Hauke Thimm" />
      </a>
    </nav>
  </div>

  <!-- Maintenance Text -->
  <section class="maintenance">
    <p>
      <strong>Welcome.</strong><br />
      This website is currently under construction.<br /><br />
      Kind regards,<br />
      Hauke Thimm
    </p>
  </section>

</body>
</html>
