<!DOCTYPE html>
<html lang="en">
<head>
<!-- Meta -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>haukethimm.com</title>

<!-- Font: Cormorant Garamond -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500;1,700&display=swap"
rel="stylesheet"
/>

<style>
:root {
--cream: #fdf7f2;
--blue: #003153;

--top-offset: 30px;
--banner-h: 110px;

--logo-h: 175px;
--side-pad: 175px;

--max-width: 1400px;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
color: var(--blue);
background-color: var(--cream);
font-family: "Cormorant Garamond", serif;
font-optical-sizing: auto;
font-weight: 500;
}

/* ===== FIXED NAV (banner + logo only) ===== */
.nav-shell {
position: fixed;
top: var(--top-offset);
left: 0;
width: 100%;
z-index: 9999;
pointer-events: none;
}

.main-nav {
position: relative;
height: var(--banner-h);
background: var(--blue);
pointer-events: auto;
}

.nav-inner {
height: 100%;
max-width: var(--max-width);
margin: 0 auto;
padding: 0 var(--side-pad);
display: flex;
align-items: center;
}

/* Logo: center point sits on bottom edge of banner */
.nav-logo {
position: absolute;
left: var(--side-pad);
top: calc(var(--banner-h) - (var(--logo-h) / 2));
display: inline-block;
}

.nav-logo img {
height: var(--logo-h);
width: auto;
display: block;
}

/* ===== HEADER IMAGE ===== */
.header-image {
width: 100%;
margin: 0;
padding: 0;
}

.header-image img {
display: block;
width: 100%;
max-width: 3000px;
height: auto;
margin: 0 auto;
object-fit: contain;
object-position: center top;
}

/* ===== LAYOUT OFFSET ===== */
.page-offset {
padding-top: calc(
var(--top-offset) + var(--banner-h) + (var(--logo-h) / 2)
);
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* ===== MAINTENANCE CENTER TEXT ===== */
.maintenance {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
text-align: center;
padding: 48px var(--side-pad);
}

.maintenance p {
margin: 0;
font-size: 20px;
font-weight: 300;
line-height: 1.7;
}

.maintenance strong {
font-weight: 500;
}

/* ===== FOOTER (blue block, no text, no logos) ===== */
.footer {
background-color: var(--blue);
height: 140px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) {
:root {
--side-pad: 32px;
}
.nav-logo {
left: var(--side-pad);
}
}

@media (max-width: 768px) {
:root {
--top-offset: 16px;
--banner-h: 86px;
--logo-h: 120px;
--side-pad: 18px;
}
.nav-inner {
padding: 0 var(--side-pad);
}
.nav-logo {
left: var(--side-pad);
top: calc(var(--banner-h) - (var(--logo-h) / 2));
}
.maintenance {
padding: 36px var(--side-pad);
}
.maintenance p {
font-size: 18px;
}
}
</style>
</head>

<body>
<!-- Fixed Nav -->
<div class="nav-shell">
<nav class="main-nav" aria-label="Primary">
<a class="nav-logo" href="#">
<img src="img/logo.png" alt="Hauke Thimm" />
</a>
<div class="nav-inner"></div>
</nav>
</div>

<!-- Header image (visible behind nav, scrolls normally) -->
<section class="header-image" aria-label="Header image">
<img src="img/header.jpg" alt="" />
</section>

<!-- Page content starts below fixed nav + logo overlap -->
<main class="page-offset">
<section class="maintenance" aria-label="Under construction message">
<p>
<strong>Welcome.</strong><br />
This website ist currently under construction.<br /><br />
Kind regards,<br />
Hauke Thimm
</p>
</section>

<!-- Footer (no text, no logos, no links) -->
<footer class="footer" aria-label="Footer"></footer>
</main>
</body>
</html>
