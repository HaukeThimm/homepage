<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>haukethimm.com</title>

        <style>
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-Light.ttf") format("truetype");
                font-weight: 300;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-Medium.ttf") format("truetype");
                font-weight: 500;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-Bold.ttf") format("truetype");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-LightItalic.ttf") format("truetype");
                font-weight: 300;
                font-style: italic;
                font-display: swap;
            }
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-MediumItalic.ttf") format("truetype");
                font-weight: 500;
                font-style: italic;
                font-display: swap;
            }
            @font-face {
                font-family: "Cormorant Garamond";
                src: url("assets/fonts/cormorant_garamond/static/CormorantGaramond-BoldItalic.ttf") format("truetype");
                font-weight: 700;
                font-style: italic;
                font-display: swap;
            }

            :root {
                --cream: #fdf7f2;
                --blue: #003153;
                --top-offset: 0px;
                --banner-h: 75px;
                --side-pad: 150px;
                --max-width: 1400px;
                --font-head: "Cormorant Garamond", serif;
                --lang-btn-size: 25px;
                --frame-w-sm: 2px;
                --frame-r-sm: 999px;
                --overlay-max: 920px;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: var(--cream);
                color: var(--blue);
            }

            body {
                min-height: 100vh;
            }

            .gold-frame {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: var(--frame-w-sm) solid transparent;
                background: linear-gradient(transparent, transparent) padding-box,
                            url("assets/img/highlights_gold.png") border-box;
                background-size: auto, cover;
                background-repeat: no-repeat, no-repeat;
                background-position: center, center;
                border-radius: var(--frame-r-sm);
                overflow: hidden;
            }

            .gold-frame > img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .nav-shell {
                position: fixed;
                top: var(--top-offset);
                left: 0;
                width: 100%;
                z-index: 9999;
                pointer-events: none;
            }

            .main-nav {
                height: var(--banner-h);
                background: var(--blue);
                pointer-events: auto;
            }

            .nav-inner {
                height: 100%;
                max-width: var(--max-width);
                margin: 0 auto;
                padding: 0 var(--side-pad);
                display: flex;
                align-items: center;
                justify-content: flex-end;
            }

            .nav-items {
                display: flex;
                align-items: center;
                gap: 28px;
            }

            .nav-contact {
                color: var(--cream);
                text-decoration: none;
                font-size: 15px;
                letter-spacing: 0.1em;
                font-weight: 500;
                text-transform: uppercase;
                white-space: nowrap;
            }

            .nav-contact:hover {
                text-decoration: underline;
            }

            .lang-toggle {
                position: relative;
                width: var(--lang-btn-size);
                height: var(--lang-btn-size);
                flex: 0 0 var(--lang-btn-size);
            }

            .lang-btn {
                position: absolute;
                inset: 0;
                border: 0;
                background: transparent;
                padding: 0;
                margin: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }

            .lang-btn.is-active {
                display: none;
            }

            .lang-btn:not(.is-active) {
                display: inline-flex;
            }

            .lang-btn .gold-frame {
                width: var(--lang-btn-size);
                height: var(--lang-btn-size);
            }

            .lang-btn .gold-frame > img {
                object-fit: cover;
            }

            .header-image {
                position: relative;
                width: 100%;
                margin: 0;
                padding-top: var(--banner-h);
                min-height: 100vh;
                display: flex;
                align-items: stretch;
            }

            .header-image img {
                display: block;
                width: 100%;
                height: calc(100vh - var(--banner-h));
                object-fit: cover;
                object-position: center center;
            }

            .header-overlay {
                position: absolute;
                top: calc(var(--banner-h) + 50%);
                left: 50%;
                transform: translate(-50%, -50%);
                width: min(calc(100% - 48px), var(--overlay-max));
                padding: 28px 34px;
                background: rgba(253, 247, 242, 0.88);
                color: var(--blue);
                text-align: center;
                backdrop-filter: blur(2px);
            }

            .welcome-head,
            .welcome-sub,
            .welcome-signoff {
                font-family: var(--font-head);
                margin: 0;
                color: var(--blue);
            }

            .welcome-head {
                font-size: clamp(34px, 5vw, 58px);
                line-height: 1.05;
                font-weight: 700;
                margin-bottom: 14px;
            }

            .welcome-sub {
                font-size: clamp(22px, 2.6vw, 30px);
                line-height: 1.35;
                font-weight: 500;
            }

            .welcome-signoff {
                font-size: clamp(22px, 2.5vw, 30px);
                line-height: 1.3;
                font-weight: 500;
                margin-top: 20px;
            }

            .signoff-line {
                display: block;
            }

            @media (max-width: 900px) {
                :root {
                    --side-pad: 28px;
                    --banner-h: 68px;
                }

                .nav-items {
                    gap: 18px;
                }

                .nav-contact {
                    font-size: 13px;
                    letter-spacing: 0.08em;
                }

                .header-overlay {
                    width: min(calc(100% - 36px), 760px);
                    padding: 22px 20px;
                }
            }

            @media (max-width: 640px) {
                :root {
                    --side-pad: 18px;
                    --banner-h: 64px;
                }

                .header-image img {
                    height: calc(100vh - var(--banner-h));
                }

                .header-overlay {
                    width: calc(100% - 24px);
                    padding: 18px 16px;
                }

                .welcome-head {
                    margin-bottom: 10px;
                }

                .welcome-signoff {
                    margin-top: 16px;
                }
            }
        </style>
    </head>

    <body>
        <div class="nav-shell">
            <nav class="main-nav" aria-label="Primary">
                <div class="nav-inner">
                    <div class="nav-items">
                        <a
                            class="nav-contact"
                            href="mailto:mail@haukethimm.com"
                            data-en="CONTACT"
                            data-de="KONTAKT"
                        >
                            KONTAKT
                        </a>

                        <div class="lang-toggle" aria-label="Language selector">
                            <button type="button" class="lang-btn" data-lang="en" aria-label="English">
                                <span class="gold-frame">
                                    <img src="assets/img/flag-uk.png" alt="EN" />
                                </span>
                            </button>

                            <button type="button" class="lang-btn is-active" data-lang="de" aria-label="Deutsch">
                                <span class="gold-frame">
                                    <img src="assets/img/flag-de.png" alt="DE" />
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>

        <section class="header-image" aria-label="Header image">
            <img src="assets/img/header.jpg" alt="" />

            <div class="header-overlay">
                <h1
                    class="welcome-head"
                    data-en="WELCOME"
                    data-de="WILLKOMMEN"
                >
                    WILLKOMMEN
                </h1>

                <p
                    class="welcome-sub"
                    data-en="Thank you for visiting my website. It is currently under construction and will be available here shortly. In the meantime, please feel free to contact me by email."
                    data-de="Vielen Dank für Ihren Besuch auf meiner Website. Sie befindet sich derzeit im Aufbau und wird Ihnen hier in Kürze zur Verfügung stehen. In der Zwischenzeit freue ich mich über Ihre Kontaktaufnahme per E-Mail."
                >
                    Vielen Dank für Ihren Besuch auf meiner Website. Sie befindet sich derzeit im Aufbau und wird Ihnen hier in Kürze zur Verfügung stehen. In der Zwischenzeit freue ich mich über Ihre Kontaktaufnahme per E-Mail.
                </p>

                <p class="welcome-signoff">
                    <span
                        class="signoff-line"
                        data-en="Kind regards,"
                        data-de="Mit freundlichen Grüßen,"
                    >
                        Mit freundlichen Grüßen,
                    </span>
                    <span
                        class="signoff-line"
                        data-en="Hauke Thimm"
                        data-de="Hauke Thimm"
                    >
                        Hauke Thimm
                    </span>
                </p>
            </div>
        </section>

        <script>
            (function () {
                const buttons = document.querySelectorAll(".lang-btn");
                const translatable = document.querySelectorAll("[data-en][data-de]");

                function setLang(lang) {
                    translatable.forEach((el) => {
                        const val = el.getAttribute(lang === "de" ? "data-de" : "data-en");
                        if (val != null) el.textContent = val;
                    });

                    buttons.forEach((b) => b.classList.toggle("is-active", b.dataset.lang === lang));
                    document.documentElement.lang = lang === "de" ? "de" : "en";
                }

                buttons.forEach((b) => {
                    b.addEventListener("click", () => setLang(b.dataset.lang));
                });

                setLang("de");
            })();
        </script>
    </body>
</html>
