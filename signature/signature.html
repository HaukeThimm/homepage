<!doctype html>
<html>
    <body>
        <!--
        EMAIL SIGNATURE (HTML) — nur mit deinen Icon-Dateien

        Assets (Pfade wie von dir vorgegeben):
        - /signature/logo.png
        - /signature/highlights_golg.png
        - /signature/icon_phone.png
        - /signature/icon_mail.png
        - /signature/icon_web.png
        - /signature/icon_location.png
        - /signature/linkedin.png
        - /signature/instagram.png

        Farben:
        - Text: #003153

        Typo:
        - Cormorant Garamond: Name + Titel
        - Source Sans 3: Kontaktzeilen + Adresse
        -->

        <!-- OUTER TABLE: maximale Client-Kompatibilität -->
        <table cellpadding="0" cellspacing="0" border="0"
            style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
            <tr>

                <!-- LINKS: LOGO + SOCIAL (unterhalb des Logos) -->
                <td style="vertical-align:top; padding:0 24px 0 0; mso-line-height-rule:exactly;">

                    <!-- Logo (nicht verlinkt) -->
                    <div style="line-height:0; mso-line-height-rule:exactly;">
                        <img src="/signature/logo.png" alt="Hauke THIMM"
                            style="height:125px; width:auto; display:block; border:0; outline:none; text-decoration:none; margin:0; padding:0;" />
                    </div>

                    <!-- Abstand: unterhalb des Logos -->
                    <div style="height:12px; line-height:12px; font-size:12px;">&nbsp;</div>

                    <!-- Social Icons: unterhalb des Logos, horizontal -->
                    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                        <tr>
                            <td style="padding:0 10px 0 0; line-height:0;">
                                <a href="https://www.linkedin.com/in/haukethimm/" style="text-decoration:none;">
                                <img src="/signature/linkedin.png" alt="LinkedIn"
                                    style="height:28px; width:auto; display:block; border:0; outline:none; text-decoration:none;" />
                                </a>
                            </td>
                            <td style="padding:0; line-height:0;">
                                <a href="https://instagram.com/haukethimm" style="text-decoration:none;">
                                <img src="/signature/instagram.png" alt="Instagram"
                                    style="height:28px; width:auto; display:block; border:0; outline:none; text-decoration:none;" />
                                </a>
                            </td>
                        </tr>
                    </table>

                </td>

                <!-- RECHTS: TEXTBLOCK -->
                <td style="vertical-align:top; padding:0; color:#003153; line-height:1; mso-line-height-rule:exactly;">

                    <table cellpadding="0" cellspacing="0" border="0"
                            style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
                        <tr>
                            <td style="vertical-align:top; padding:0; line-height:1; mso-line-height-rule:exactly;">

                                <!-- NAME (Cormorant Garamond) -->
                                <div style="margin:0 0 4px 0; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:26px; font-weight:700; line-height:1.1; color:#003153;">
                                Hauke <span style="letter-spacing:0.02em;">THIMM</span>
                                </div>

                                <!-- TITLE (Cormorant Garamond) -->
                                <div style="margin:0 0 10px 0; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:20px; font-weight:500; line-height:1.15; color:#003153;">
                                High-level Events &amp; Protocol Manager
                                </div>

                                <!-- DIVIDER (mit deinem highlights_golg.png) -->
                                <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; margin:0 0 12px 0;">
                                    <tr>
                                        <td style="padding:0; line-height:0;">
                                            <!-- Breite richtet sich am Textblock aus; Höhe 5px wie gewünscht -->
                                            <span style="display:block; height:5px; width:100%; max-width:520px;
                                                        background-image:url('/signature/highlights_golg.png');
                                                        background-repeat:no-repeat; background-size:100% 100%;
                                                        background-position:center;">
                                                &nbsp;
                                            </span>
                                        </td>
                                    </tr>
                                </table>

                                <!-- KONTAKTZEILEN: Icon (PNG) + Text -->
                                <table cellpadding="0" cellspacing="0" border="0"
                                    style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

                                    <!-- Gemeinsame Icon-Größe: an Vorlage angelehnt -->
                                    <!-- PHONE -->
                                    <tr>
                                        <td style="vertical-align:middle; padding:0 10px 10px 0; line-height:0;">
                                        <img src="/signature/icon_phone.png" alt=""
                                            style="height:18px; width:18px; display:block; border:0; outline:none;" />
                                        </td>
                                        <td style="vertical-align:middle; padding:0 0 10px 0;">
                                        <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; color:#003153; white-space:nowrap;">
                                            +49 160 95364569
                                        </div>
                                        </td>
                                    </tr>

                                    <!-- EMAIL -->
                                    <tr>
                                        <td style="vertical-align:middle; padding:0 10px 10px 0; line-height:0;">
                                        <img src="/signature/icon_mail.png" alt=""
                                            style="height:18px; width:18px; display:block; border:0; outline:none;" />
                                        </td>
                                        <td style="vertical-align:middle; padding:0 0 10px 0;">
                                        <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; color:#003153; white-space:nowrap;">
                                            <a href="mailto:mail@haukethimm.com"
                                            style="color:#003153 !important; text-decoration:none !important; font-weight:400;">
                                            mail@haukethimm.com
                                            </a>
                                        </div>
                                        </td>
                                    </tr>

                                    <!-- WEBSITE -->
                                    <tr>
                                        <td style="vertical-align:middle; padding:0 10px 10px 0; line-height:0;">
                                        <img src="/signature/icon_web.png" alt=""
                                            style="height:18px; width:18px; display:block; border:0; outline:none;" />
                                        </td>
                                        <td style="vertical-align:middle; padding:0 0 10px 0;">
                                        <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; color:#003153; white-space:nowrap;">
                                            <a href="https://haukethimm.com"
                                            style="color:#003153 !important; text-decoration:none !important; font-weight:400;">
                                            https://haukethimm.com
                                            </a>
                                        </div>
                                        </td>
                                    </tr>

                                    <!-- ADDRESS -->
                                    <tr>
                                        <td style="vertical-align:middle; padding:0 10px 0 0; line-height:0;">
                                        <img src="/signature/icon_location.png" alt=""
                                            style="height:18px; width:18px; display:block; border:0; outline:none;" />
                                        </td>
                                        <td style="vertical-align:middle; padding:0;">
                                        <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; color:#003153;">
                                            Marienthaler Straße 124B, 20535 Hamburg, GERMANY
                                        </div>
                                        </td>
                                    </tr>

                                </table>

                            </td>
                        </tr>
                    </table>

                </td>
            </tr>
        </table>

        <!--
        WICHTIG (Layout-Regel für die Social Icons):
        - Oben (Logo->Social) ist aktuell 12px Abstand.
        - Unten (Social->Unterkante letzte Textzeile) ist in E-Mail-Clients NICHT zuverlässig mess-/koppelbar,
            weil linke und rechte Spalte unabhängig hoch sind.
        - Dieses Markup ist die stabilste, client-sichere Annäherung: Social direkt unter Logo mit definiertem Gap.
        -->

    </body>
</html>
