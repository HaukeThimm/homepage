<!doctype html>
<html>
    <body>
        <!--
        SIGNATUR (TABELLENBASIERT)
        Ziele:
        - Outlook-/Client-stabile Darstellung (mso-table-lspace/rspace)
        - Logo-Oberkante exakt auf Höhe der ersten Textzeile ("Hauke THIMM")
        - Telefonnummer NICHT verlinkt
        - Typo-Hierarchie: Cormorant (Name + Titel), Source Sans 3 (Kontakt)
        - Keine Social-Icons (auskommentiert)
        -->

        <!-- 1) AUSSEN-TABELLE: Outlook-kompatible Null-Ränder -->
        <table cellpadding="0" cellspacing="0" border="0"
            style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
            <tr>
                <!-- 2) LINKE SPALTE: LOGO (Top-Kante "hart", kein Zeilenhöhen-Offset) -->
                <td style="vertical-align:top; padding:0 20px 0 0; line-height:0; mso-line-height-rule:exactly;">
                    <a href="https://haukethimm.com" style="text-decoration:none;">
                        <img
                        src="logo.png"
                        alt="Hauke THIMM"
                        style="height:125px; width:auto; display:block; border:0; outline:none; text-decoration:none; margin:0; padding:0;"
                        />
                    </a>
                </td>

                <!-- 3) RECHTE SPALTE: TEXT (line-height:1 verhindert Outlook-"Extra-Luft") -->
                <td style="vertical-align:top; color:#003153; padding:0; line-height:1; mso-line-height-rule:exactly;">

                    <!-- 4) INNERE TABELLE: optional, aber stabil in vielen Mail-Clients -->
                    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
                        <tr>
                            <!-- 5) INNERE ZELLE: ebenfalls line-height:1 für konsistente Top-Ausrichtung -->
                            <td style="vertical-align:top; padding:0; line-height:1; mso-line-height-rule:exactly;">

                                <!-- NAME (Cormorant Garamond) -->
                                <div style="margin:0 0 5px 0; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:24px; font-weight:700; line-height:1.15;">
                                Hauke <span style="letter-spacing:0.02em;">THIMM</span>
                                </div>

                                <!-- TITEL / POSITION (Cormorant Garamond) -->
                                <div style="margin:0 0 10px 0; font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size:20px; font-weight:500; line-height:1.15;">
                                High-Level Events &amp; Protocol Management
                                </div>

                                <!-- TELEFON (Source Sans 3) | Labels haben feste Breite -> Texte starten bündig -->
                                <div style="margin:0 0 3px 0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                    <span style="display:inline-block; width:22px;">T:</span>
                                    <span style="font-weight:400;">+49 160 95364569</span>
                                </div>

                                <!-- E-MAIL (Source Sans 3) -->
                                <div style="margin:0 0 3px 0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                    <span style="display:inline-block; width:22px;">E:</span>
                                    <a href="mailto:mail@haukethimm.com" style="color:#003153; text-decoration:none; font-weight:500;">
                                        mail@haukethimm.com
                                    </a>
                                </div>

                                <!-- WEBSITE (Source Sans 3) -->
                                <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                    <span style="display:inline-block; width:22px;">W:</span>
                                    <a href="https://haukethimm.com" style="color:#003153; text-decoration:none; font-weight:500;">
                                        haukethimm.com
                                    </a>
                                </div>

                            <!--
                                 TELEFON (Source Sans 3) | WICHTIG: KEIN tel:-Link 
                                <div style="margin:0 0 3px 0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                T: <span style="font-weight:400;">+49 160 95364569</span>
                                </div>

                                 E-MAIL (Source Sans 3) 
                                <div style="margin:0 0 3px 0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                E:
                                <a href="mailto:mail@haukethimm.com" style="color:#003153; text-decoration:none; font-weight:500;">
                                    mail@haukethimm.com
                                </a>
                                </div>

                                 WEBSITE (Source Sans 3) 
                                <div style="margin:0; font-family:'Source Sans 3', Arial, Helvetica, sans-serif; font-size:14px; font-weight:400; line-height:1.35; white-space:nowrap;">
                                W:
                                <a href="https://haukethimm.com" style="color:#003153; text-decoration:none; font-weight:500;">
                                    haukethimm.com
                                </a>
                                </div> 
                            -->

                            </td>
                        </tr>

                        <tr>
                        <td style="vertical-align:bottom; padding:0;">

                                src="instagram.png"

                                />
                            </a>

                        </td>
                        </tr>
                        -->

                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
